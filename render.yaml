services:
  # FastAPI Backend
  - type: web
    name: compliance-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      - key: DATABASE_URL
        fromDatabase:
          name: compliance-db
          property: connectionString

      - key: JWT_SECRET
        generateValue: true

      - key: JWT_ALGORITHM
        value: HS256

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"

      - key: STORAGE_PATH
        value: "./storage"

      - key: DEMO_MODE
        value: "true"

  # React/Vite Frontend
  - type: web
    name: compliance-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: compliance-backend
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: compliance-db
    plan: free